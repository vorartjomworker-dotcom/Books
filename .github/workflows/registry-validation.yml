name: Registry validation

on:
  push:
    branches: [main, "translation/**"]
    paths:
      - "chapters/**"
      - "qa/**"
      - "manifests/**"
      - "config/**"
      - "automation/**"
      - "scripts/**"
      - "tests/**"
      - "requirements-ci.txt"
      - ".github/workflows/registry-validation.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install validator dependency
        run: python -m pip install -r requirements-ci.txt
      - name: Run validator tests
        run: python -m unittest discover -s tests -v
      - name: Validate registries and checksums
        run: python scripts/validate_registries.py --root .
      - name: Validate autonomous pipeline state
        run: python scripts/validate_pipeline_state.py --root .
